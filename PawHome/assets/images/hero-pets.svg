<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustrated golden dog and ginger cat relaxing together at Paw Home">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDF4E8"/>
      <stop offset="100%" stop-color="#F6E3CF"/>
    </linearGradient>
    <linearGradient id="sunbeam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFDF8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FCE4C8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#wall)"/>
  <!-- Sunlit Window -->
  <rect x="65" y="45" width="230" height="270" rx="14" fill="#FFFDF8" stroke="#DECBB7" stroke-width="8"/>
  <line x1="180" y1="45" x2="180" y2="315" stroke="#DECBB7" stroke-width="6"/>
  <line x1="65" y1="180" x2="295" y2="180" stroke="#DECBB7" stroke-width="6"/>
  <polygon points="100,60 280,60 560,560 230,560" fill="url(#sunbeam)"/>
  <!-- Potted Plant -->
  <path d="M625 405 L685 405 L674 475 L636 475 Z" fill="#D96B43"/>
  <ellipse cx="655" cy="405" rx="30" ry="7" fill="#B9512C"/>
  <path d="M655 402 C630 355 605 320 622 285 C642 315 655 355 655 402 Z" fill="#2E5B47"/>
  <path d="M655 402 C675 345 712 318 705 278 C675 305 660 350 655 402 Z" fill="#3B735A"/>
  <path d="M655 402 C652 340 655 292 664 252 C676 292 670 350 655 402 Z" fill="#4C8A6D"/>
  <!-- Sofa -->
  <rect x="115" y="345" width="540" height="195" rx="34" fill="#E9DAC7"/>
  <rect x="95" y="420" width="580" height="130" rx="28" fill="#DFCBB3"/>
  <rect x="95" y="395" width="76" height="145" rx="28" fill="#D4BE9F"/>
  <rect x="599" y="395" width="76" height="145" rx="28" fill="#D4BE9F"/>
  <!-- Warm Throw Blanket -->
  <path d="M180 420 Q250 405 310 422 L305 535 Q240 545 178 530 Z" fill="#D96B43" opacity="0.88"/>
  <!-- Golden Dog -->
  <g transform="translate(260, 210)">
    <ellipse cx="98" cy="215" rx="76" ry="58" fill="#E3A557"/>
    <ellipse cx="98" cy="230" rx="44" ry="38" fill="#F4C987"/>
    <!-- Ears -->
    <ellipse cx="42" cy="116" rx="22" ry="44" transform="rotate(14 42 116)" fill="#C48238"/>
    <ellipse cx="154" cy="116" rx="22" ry="44" transform="rotate(-14 154 116)" fill="#C48238"/>
    <!-- Head -->
    <circle cx="98" cy="110" r="56" fill="#E9B266"/>
    <ellipse cx="98" cy="130" rx="28" ry="22" fill="#F8D8A6"/>
    <!-- Eyes & Nose -->
    <circle cx="77" cy="98" r="6.5" fill="#1F2A24"/>
    <circle cx="119" cy="98" r="6.5" fill="#1F2A24"/>
    <circle cx="79" cy="96" r="2" fill="#FFF"/>
    <circle cx="121" cy="96" r="2" fill="#FFF"/>
    <ellipse cx="98" cy="122" rx="11" ry="8" fill="#2A2320"/>
    <path d="M88 134 Q98 145 108 134" fill="none" stroke="#2A2320" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M93 139 Q98 153 103 139 Z" fill="#E66B6B"/>
    <!-- Sage Collar -->
    <rect x="64" y="158" width="68" height="14" rx="7" fill="#2E5B47"/>
    <circle cx="98" cy="175" r="7" fill="#F4C95D"/>
    <!-- Front Paws -->
    <ellipse cx="66" cy="252" rx="18" ry="12" fill="#F4C987"/>
    <ellipse cx="130" cy="252" rx="18" ry="12" fill="#F4C987"/>
  </g>
  <!-- Ginger Tabby Cat -->
  <g transform="translate(455, 295)">
    <path d="M98 148 Q138 148 135 106 Q133 88 122 92" fill="none" stroke="#DF7B42" stroke-width="14" stroke-linecap="round"/>
    <ellipse cx="58" cy="118" rx="44" ry="42" fill="#EB8D52"/>
    <ellipse cx="58" cy="128" rx="24" ry="26" fill="#FCE5CD"/>
    <!-- Ears -->
    <polygon points="24,58 34,20 52,48" fill="#DF7B42"/>
    <polygon points="92,58 82,20 64,48" fill="#DF7B42"/>
    <polygon points="30,52 35,29 47,47" fill="#F6B89E"/>
    <polygon points="86,52 81,29 69,47" fill="#F6B89E"/>
    <!-- Head -->
    <circle cx="58" cy="68" r="36" fill="#EB8D52"/>
    <path d="M50 38 L53 49 M58 35 L58 49 M66 38 L63 49" stroke="#C55E2A" stroke-width="3" stroke-linecap="round"/>
    <circle cx="44" cy="66" r="4.8" fill="#1F2A24"/>
    <circle cx="72" cy="66" r="4.8" fill="#1F2A24"/>
    <circle cx="45.5" cy="64.5" r="1.5" fill="#FFF"/>
    <circle cx="73.5" cy="64.5" r="1.5" fill="#FFF"/>
    <polygon points="58,77 53,72 63,72" fill="#D96B6B"/>
    <path d="M49 80 Q58 86 58 77 Q58 86 67 80" fill="none" stroke="#2A2320" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Whiskers -->
    <path d="M32 72 L12 69 M32 77 L12 80 M84 72 L104 69 M84 77 L104 80" stroke="#FFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>
  <!-- Floating Heart -->
  <path d="M420 198 C420 186 436 182 442 193 C448 182 464 186 464 198 C464 214 442 226 442 226 C442 226 420 214 420 198 Z" fill="#D96B43" opacity="0.88"/>
</svg>
