  <circle cx="334" cy="182" r="9.5" fill="#15191B"/>
  <circle cx="269" cy="179" r="3" fill="#FFF"/>
  <circle cx="337" cy="179" r="3" fill="#FFF"/>
  <!-- Nose & Happy Mouth -->
