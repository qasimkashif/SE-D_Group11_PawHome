      <stop offset="0%" stop-color="#E7F0F5"/>
      <stop offset="100%" stop-color="#D7E8D8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg-luna)"/>
  <path d="M0 355 Q210 320 420 350 T600 340 L600 450 L0 450 Z" fill="#8BB795"/>
