  <ellipse cx="300" cy="352" rx="54" ry="56" fill="#FFF3E5"/>
  <!-- Ears -->
  <polygon points="222,175 242,95 280,154" fill="#E88950"/>
  <polygon points="378,175 358,95 320,154" fill="#E88950"/>
  <polygon points="234,164 246,112 271,152" fill="#F9C1AC"/>
  <polygon points="366,164 354,112 329,152" fill="#F9C1AC"/>
