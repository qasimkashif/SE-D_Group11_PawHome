  <!-- Eyes -->
  <ellipse cx="268" cy="188" rx="11" ry="13" fill="#2E5B47"/>
  <ellipse cx="332" cy="188" rx="11" ry="13" fill="#2E5B47"/>
  <ellipse cx="268" cy="189" rx="5" ry="9" fill="#1F2A24"/>
  <ellipse cx="332" cy="189" rx="5" ry="9" fill="#1F2A24"/>
  <circle cx="272" cy="183" r="3" fill="#FFF"/>
  <circle cx="336" cy="183" r="3" fill="#FFF"/>
  <!-- Nose & Mouth -->
  <polygon points="300,214 291,204 309,204" fill="#E27A7A"/>
  <path d="M282 222 Q300 232 300 214 Q300 232 318 222" fill="none" stroke="#2A2320" stroke-width="4" stroke-linecap="round"/>
  <!-- Whiskers -->
