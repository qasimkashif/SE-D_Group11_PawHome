<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-label="Portrait of Mochi, a cream and ginger tabby cat">
  <defs>
    <linearGradient id="bg-mochi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF2E4"/>
      <stop offset="100%" stop-color="#F7DCC2"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg-mochi)"/>
  <ellipse cx="300" cy="395" rx="220" ry="60" fill="#E4C9AE"/>
  <!-- Tail -->
  <path d="M385 375 Q468 372 465 305 Q462 276 440 282" fill="none" stroke="#E88950" stroke-width="24" stroke-linecap="round"/>
