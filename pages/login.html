<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login &amp; Sign Up | Paw Home Islamabad</title>

  <!-- 1. Bootstrap 5 CSS (CDN) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <!-- 2. Paw Home Global Theme -->
  <link rel="stylesheet" href="../css/style.css">
  <!-- 3. Login Page Styles -->
  <link rel="stylesheet" href="../css/login.css">
</head>
<body class="login-page">
  <!-- Accessible skip link for keyboard users -->
  <a href="#main" class="skip-link">Skip to main content</a>

  <!-- Shared header and nav injected by ../js/layout.js -->
  <div id="site-header"></div>

  <main id="main" tabindex="-1" class="login-main">
    <section class="login-section" aria-labelledby="auth-heading">
      <div class="container login-container">
        <!-- Centred Authentication Card -->
        <div class="card login-card" id="auth-card">
          <div class="card-body login-card-body">

            <!-- View 1: Login / Sign Up Tabs (shown when logged out) -->
            <div id="auth-view">
              <header class="login-card-header text-center mb-3">
                <h1 id="auth-heading" class="login-heading">Paw Home Account</h1>
                <p class="login-subheading mb-0">
                  Sign in or create an account to save favourite pets in Islamabad.
                </p>
              </header>

              <!-- Bootstrap 5 Tabs: Login | Sign Up -->
              <ul class="nav nav-tabs nav-fill login-tabs" id="auth-tabs" role="tablist">
                <li class="nav-item" role="presentation">
                  <button
                    class="nav-link active"
                    id="login-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#login-pane"
                    type="button"
                    role="tab"
                    aria-controls="login-pane"
                    aria-selected="true"
                  >
                    Login
                  </button>
                </li>
                <li class="nav-item" role="presentation">
                  <button
                    class="nav-link"
                    id="signup-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#signup-pane"
                    type="button"
                    role="tab"
                    aria-controls="signup-pane"
                    aria-selected="false"
                  >
                    Sign Up
                  </button>
                </li>
              </ul>

              <!-- Tab Panels -->
              <div class="tab-content pt-4" id="auth-tab-content">

                <!-- Login Tab Panel -->
                <div
                  class="tab-pane fade show active"
                  id="login-pane"
                  role="tabpanel"
                  aria-labelledby="login-tab"
                  tabindex="0"
                >
                  <form id="login-form" novalidate>
                    <!-- Email Field -->
                    <div class="mb-3">
                      <label for="login-email" class="form-label">Email address</label>
                      <input
                        type="email"
                        class="form-control"
                        id="login-email"
                        name="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        aria-describedby="login-email-error"
                        required
                      >
                      <p id="login-email-error" class="field-error" aria-live="polite"></p>
                    </div>

                    <!-- Password Field with Show/Hide Eye Button -->
                    <div class="mb-3">
                      <label for="login-password" class="form-label">Password</label>
                      <div class="input-group">
                        <input
                          type="password"
                          class="form-control"
                          id="login-password"
                          name="password"
                          autocomplete="current-password"
                          placeholder="Enter your password"
                          aria-describedby="login-password-error"
                          required
                        >
                        <button
                          type="button"
                          class="btn toggle-password-btn"
                          id="login-toggle-password"
                          aria-label="Show password"
                          aria-pressed="false"
                          data-target="login-password"
                        >
                          <!-- Simple inline SVG eye icon (no extra icon library needed) -->
                          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                          </svg>
                        </button>
                      </div>
                      <p id="login-password-error" class="field-error" aria-live="polite"></p>
                    </div>

                    <!-- Remember Me Checkbox -->
                    <div class="form-check mb-3">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        id="login-remember"
                        name="remember"
                      >
                      <label class="form-check-label" for="login-remember">
                        Remember me
                      </label>
                    </div>

                    <!-- Form-level Status / Error Message -->
                    <p id="login-form-message" class="form-message" aria-live="polite"></p>

                    <!-- Login Submit Button -->
                    <button type="submit" class="btn btn-paw-primary login-submit-btn" id="login-submit-btn">
                      Login
                    </button>
                  </form>
                </div>

                <!-- Sign Up Tab Panel -->
                <div
                  class="tab-pane fade"
                  id="signup-pane"
                  role="tabpanel"
                  aria-labelledby="signup-tab"
                  tabindex="0"
                >
                  <form id="signup-form" novalidate>
                    <!-- Full Name Field -->
                    <div class="mb-3">
                      <label for="signup-name" class="form-label">Full name</label>
                      <input
                        type="text"
                        class="form-control"
                        id="signup-name"
                        name="fullName"
                        autocomplete="name"
                        placeholder="e.g. Ayesha Khan"
                        aria-describedby="signup-name-error"
                        required
                      >
                      <p id="signup-name-error" class="field-error" aria-live="polite"></p>
                    </div>

                    <!-- Email Field -->
                    <div class="mb-3">
                      <label for="signup-email" class="form-label">Email address</label>
                      <input
                        type="email"
                        class="form-control"
                        id="signup-email"
                        name="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        aria-describedby="signup-email-error"
                        required
                      >
                      <p id="signup-email-error" class="field-error" aria-live="polite"></p>
                    </div>

                    <!-- Password Field with Show/Hide Eye Button & Strength Meter -->
                    <div class="mb-3">
                      <label for="signup-password" class="form-label">Password</label>
                      <div class="input-group">
                        <input
                          type="password"
                          class="form-control"
                          id="signup-password"
                          name="password"
                          autocomplete="new-password"
                          placeholder="Create a password"
                          aria-describedby="signup-strength-text signup-password-error"
                          required
                        >
                        <button
                          type="button"
                          class="btn toggle-password-btn"
                          id="signup-toggle-password"
                          aria-label="Show password"
                          aria-pressed="false"
                          data-target="signup-password"
                        >
                          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                          </svg>
                        </button>
                      </div>

                      <!-- Password Strength Meter (grey and empty by default) -->
                      <div class="strength-meter mt-2" id="signup-strength-meter">
                        <div
                          class="strength-bar-track"
                          id="signup-strength-track"
                          role="progressbar"
                          aria-label="Password strength"
                          aria-valuemin="0"
                          aria-valuemax="100"
                          aria-valuenow="0"
                        >
                          <div class="strength-bar-fill" id="signup-strength-fill"></div>
                        </div>
                        <p id="signup-strength-text" class="strength-label" aria-live="polite"></p>
                      </div>

                      <p id="signup-password-error" class="field-error" aria-live="polite"></p>
                    </div>

                    <!-- Confirm Password Field -->
                    <div class="mb-3">
                      <label for="signup-confirm-password" class="form-label">Confirm password</label>
                      <input
                        type="password"
                        class="form-control"
                        id="signup-confirm-password"
                        name="confirmPassword"
                        autocomplete="new-password"
                        placeholder="Re-enter your password"
                        aria-describedby="signup-confirm-password-error"
                        required
                      >
                      <p id="signup-confirm-password-error" class="field-error" aria-live="polite"></p>
                    </div>

                    <!-- Form-level Status / Error Message -->
                    <p id="signup-form-message" class="form-message" aria-live="polite"></p>

                    <!-- Create Account Submit Button -->
                    <button type="submit" class="btn btn-paw-primary login-submit-btn" id="signup-submit-btn">
                      Create Account
                    </button>
                  </form>
                </div>

              </div>
            </div>

            <!-- View 2: Hidden Logged-In View (shown by JS when a session exists) -->
            <div id="logged-in-view" class="logged-in-view d-none text-center">
              <span class="logged-in-badge">Signed In</span>
              <h2 id="logged-in-heading" class="logged-in-heading mt-3">
                Welcome, <span id="logged-in-name">NAME</span>
              </h2>
              <p id="logged-in-text" class="logged-in-text">
                You are signed in to Paw Home Islamabad. Explore available pets or manage your saved favourites.
              </p>
              <div class="logged-in-actions">
                <a href="../pages/pets.html" class="btn btn-paw-primary" id="browse-pets-link">
                  Browse Pets
                </a>
                <button type="button" class="btn btn-paw-logout" id="logout-btn">
                  Logout
                </button>
              </div>
            </div>

          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Shared footer injected by ../js/layout.js -->
  <div id="site-footer"></div>

  <!-- Bootstrap 5 JS Bundle (required for Bootstrap tabs) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Shared Paw Home Scripts + Page Script -->
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
