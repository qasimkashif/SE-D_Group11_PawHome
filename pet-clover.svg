<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-label="Portrait of Clover, a caramel and white Holland Lop rabbit">
  <defs>
    <linearGradient id="bg-clover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF3E8"/>
      <stop offset="100%" stop-color="#EFE2D0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg-clover)"/>
  <ellipse cx="300" cy="382" rx="220" ry="48" fill="#DFD1BE"/>
  <!-- Lop Ears -->
  <ellipse cx="208" cy="212" rx="26" ry="74" transform="rotate(14 208 212)" fill="#BA7B4A"/>
  <ellipse cx="392" cy="212" rx="26" ry="74" transform="rotate(-14 392 212)" fill="#BA7B4A"/>
  <!-- Body -->
  <ellipse cx="300" cy="316" rx="92" ry="76" fill="#D59A68"/>
  <ellipse cx="300" cy="330" rx="54" ry="52" fill="#FFF9F2"/>
  <!-- Head -->
  <circle cx="300" cy="196" r="72" fill="#D59A68"/>
  <ellipse cx="300" cy="222" rx="38" ry="28" fill="#FFF9F2"/>
  <!-- Eyes -->
  <circle cx="268" cy="186" r="8.5" fill="#1F2A24"/>
  <circle cx="332" cy="186" r="8.5" fill="#1F2A24"/>
  <circle cx="271" cy="183" r="2.8" fill="#FFF"/>
  <circle cx="335" cy="183" r="2.8" fill="#FFF"/>
  <!-- Pink Nose -->
  <polygon points="300,213 292,205 308,205" fill="#EC8B93"/>
  <path d="M286 221 Q300 229 300 213 Q300 229 314 221" fill="none" stroke="#4D392C" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Paws -->
  <ellipse cx="268" cy="378" rx="22" ry="13" fill="#FFF9F2"/>
  <ellipse cx="332" cy="378" rx="22" ry="13" fill="#FFF9F2"/>
  <!-- Clover Leaf Accent -->
  <circle cx="468" cy="355" r="14" fill="#2E5B47"/>
  <circle cx="486" cy="340" r="14" fill="#3B735A"/>
  <circle cx="496" cy="360" r="14" fill="#2E5B47"/>
</svg>
