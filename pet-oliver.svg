      <stop offset="0%" stop-color="#F6EFE6"/>
      <stop offset="100%" stop-color="#E7DDD0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg-oliver)"/>
  <rect x="0" y="345" width="600" height="105" fill="#C9A882"/>
  <!-- Tail -->
